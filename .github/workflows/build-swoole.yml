name: Build Swoole Extension

on:
  workflow_dispatch:
    inputs:
      swoole_version:
        description: 'Swoole 版本 (留空则安装最新版)'
        required: false
        default: ''
      php_version:
        description: 'PHP 版本'
        required: true
        default: '8.2'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.1', '8.2', '8.3']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: swoole
          tools: phpize
        env:
          SWOOLE_CONFIGURE_OPTS: --enable-openssl --enable-http2

      - name: Install specific Swoole version (if requested)
        if: github.event.inputs.swoole_version != ''
        run: |
          pecl uninstall -r swoole
          pecl install swoole-${{ github.event.inputs.swoole_version }}

      # 使用 PHP 内置函数获取扩展目录（更稳定）
      - name: Get extension directory
        id: get-ext-dir
        run: |
          EXT_DIR=$(php -r "echo ini_get('extension_dir');")
          echo "EXT_DIR=$EXT_DIR" >> $GITHUB_OUTPUT
          echo "Swoole extension installed at: $EXT_DIR/swoole.so"

      # 验证文件是否存在
      - name: Verify swoole.so
        run: |
          EXT_DIR=$(php -r "echo ini_get('extension_dir');")
          if [ ! -f "$EXT_DIR/swoole.so" ]; then
            echo "Error: swoole.so not found in $EXT_DIR"
            exit 1
          fi
          echo "✅ swoole.so is ready at $EXT_DIR/swoole.so"

      - name: Upload swoole.so
        uses: actions/upload-artifact@v4
        with:
          name: swoole-so-php-${{ matrix.php-version }}
          path: ${{ steps.get-ext-dir.outputs.EXT_DIR }}/swoole.so
          retention-days: 30
