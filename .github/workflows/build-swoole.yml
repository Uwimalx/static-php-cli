name: Build Swoole for PHP 8.4 (Debian 11, glibc 2.31)

on:
  workflow_dispatch:
    inputs:
      swoole_version:
        description: 'Swoole 版本号 (留空则自动使用最新稳定版)'
        required: false
        default: ''
      php_version:
        description: 'PHP 版本'
        required: true
        default: '8.4'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 这里只构建 PHP 8.4，如果你需要其他版本可自行添加，但建议保持 bullseye 基础镜像
        php-version: ['8.4']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build swoole.so inside Docker (bullseye)
        run: |
          PHP_VERSION="${{ matrix.php-version }}"
          SWOOLE_VERSION="${{ github.event.inputs.swoole_version }}"
          
          # 使用 Debian 11 (bullseye) 基础镜像，glibc 2.31
          IMAGE="php:${PHP_VERSION}-cli-bullseye"
          
          cat > build-swoole.sh << 'EOF'
          #!/bin/bash
          set -e

          apt-get update
          apt-get install -y --no-install-recommends \
              build-essential \
              autoconf \
              libssl-dev \
              git \
              unzip \
              pkg-config

          # 安装 PHP 的 sockets 扩展（提供头文件）
          docker-php-ext-install sockets

          # 确定 Swoole 版本（若未指定则获取最新稳定版）
          if [ -n "$SWOOLE_VERSION" ]; then
              SWOOLE_TAG="v${SWOOLE_VERSION}"
          else
              echo "Fetching latest stable Swoole version..."
              SWOOLE_TAG=$(git ls-remote --tags https://github.com/swoole/swoole-src.git \
                  | grep -o 'v[0-9]\+\.[0-9]\+\.[0-9]\+$' \
                  | sort -V \
                  | tail -1)
              echo "Latest tag: $SWOOLE_TAG"
          fi

          git clone --branch "$SWOOLE_TAG" --single-branch --depth 1 https://github.com/swoole/swoole-src.git /tmp/swoole
          cd /tmp/swoole
          phpize
          ./configure \
              --enable-openssl \
              --enable-http2 \
              --enable-mysqlnd
          make -j$(nproc)
          make install

          EXT_DIR=$(php -r "echo ini_get('extension_dir');")
          mkdir -p /output
          cp "$EXT_DIR/swoole.so" /output/
          echo "swoole.so copied to /output/"
          EOF

          chmod +x build-swoole.sh

          docker run --rm \
              -v $(pwd):/workspace \
              -w /workspace \
              -e SWOOLE_VERSION="$SWOOLE_VERSION" \
              "$IMAGE" \
              bash -c "bash build-swoole.sh && cp /output/swoole.so /workspace/"

          if [ ! -f "swoole.so" ]; then
              echo "❌ Failed to generate swoole.so"
              exit 1
          fi
          echo "✅ swoole.so generated successfully"

      - name: Check glibc dependency
        run: |
          echo "Highest GLIBC version required:"
          objdump -T swoole.so | grep GLIBC_ | sed 's/.*GLIBC_\([0-9.]*\).*/\1/g' | sort -uV | tail -1

      - name: Upload swoole.so
        uses: actions/upload-artifact@v4
        with:
          name: swoole-so-php-${{ matrix.php-version }}-bullseye-glibc2.31
          path: swoole.so
          retention-days: 30
